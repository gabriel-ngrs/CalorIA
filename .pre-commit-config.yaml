repos:
  # Mantenha esta rev alinhada com o ruff que o projeto resolve de fato
  # (`backend/pyproject.toml` pede `ruff>=0.8.0`, hoje 0.15.2) — que é também o que
  # roda no CI. Com a rev antiga o hook e o CI discordavam: `UP038` foi removida
  # depois da 0.8.0, e o `ruff-format` da 0.8.0 reformatava 4 arquivos que a 0.15
  # considera já formatados. Um hook que reprova o que o CI aprova treina o
  # desenvolvedor a ignorá-lo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # `backend/app/prompts/` guarda o texto bruto dos prompts de produção, com
      # `sha256` travado por teste. Espaço em branco ali é conteúdo: aparar o fim
      # de linha ou acrescentar newline final reescreve o prompt e quebra o sha
      # sem que ninguém tenha editado o prompt.
      - id: trailing-whitespace
        exclude: ^backend/app/prompts/
      - id: end-of-file-fixer
        exclude: ^backend/app/prompts/
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: no-commit-to-branch
        args: [--branch, main]
