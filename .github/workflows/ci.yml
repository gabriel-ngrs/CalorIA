name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caloria
          POSTGRES_PASSWORD: caloria
          POSTGRES_DB: caloria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bloqueante por desenho, e varre o histórico completo (daí o fetch-depth: 0).
      # --redact impede que o segredo apareça no log do CI, que é tão acessível
      # quanto o repositório. --config explícito para não depender de auto-detecção.
      - name: Varredura de segredos — gitleaks
        working-directory: .
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact --no-banner --exit-code 1
        env:
          GITLEAKS_VERSION: 8.21.2

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint — ruff
        run: ruff check .

      - name: Type check — mypy
        run: mypy app/ evals/

      # Camada RÁPIDA do eval: zero rede, roda a cada PR. Falha se o payload
      # enviado ao provedor mudar sem atualização do snapshot — a regressão de
      # prompt que sai de graça, antes de gastar quota. A camada completa roda
      # em agenda, em `eval.yml`.
      - name: Eval — camada rápida (sem rede)
        run: pytest tests/unit/test_evals_snapshot.py tests/unit/test_evals_metrics.py tests/unit/test_evals_schema.py tests/unit/test_evals_invariance.py tests/unit/test_evals_report.py -q

      - name: Testes
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-com-minimo-32-caracteres
          GROQ_API_KEY: fake-key-for-tests
        # `--cov-fail-under` aplica o piso LOCALMENTE, no próprio job: o
        # upload ao Codecov tem `continue-on-error` e não serve de gate.
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70 -q

      - name: Upload cobertura
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend:
    name: Frontend — lint e build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint

      - name: Testes
        run: npm test -- --passWithNoTests

      - name: Build de produção
        env:
          NEXTAUTH_SECRET: ci-test-secret-key-qualquer
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
