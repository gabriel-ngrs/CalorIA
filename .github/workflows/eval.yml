name: Eval do pipeline de IA

# Camada COMPLETA do eval: fala com a Groq real e com o banco real.
#
# Não roda por PR, de propósito. O free tier da Groq derrubou a rodada de
# 2026-07-26 com `429` no terceiro caso, e um eval que morre na metade não é
# gate — é ruído. A camada rápida (cassettes + snapshot de payload, em
# `tests/unit/test_evals_snapshot.py`) é a que roda a cada PR, sem rede.
#
# Periodicidade semanal, não diária: com ~10 casos, mais os grupos de
# invariância, uma rodada diária no free tier tende a esbarrar na quota. Ajustar
# junto de uma medição real de consumo, não por palpite.
on:
  schedule:
    - cron: "0 6 * * 1" # segunda-feira, 06:00 UTC (03:00 America/Sao_Paulo)
  workflow_dispatch:
    inputs:
      estrato:
        description: "Estrato a executar (vazio = todos)"
        required: false
        type: choice
        options: ["", "simples", "composto", "foto"]

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    name: Eval completo
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caloria
          POSTGRES_PASSWORD: caloria
          POSTGRES_DB: caloria_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Aplicar migrations
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_db
        run: alembic upgrade head

      - name: Semear banco nutricional
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_db
        run: |
          python scripts/seed_taco.py
          python scripts/seed_portions.py

      # O cache em disco reduz o consumo de quota entre execuções: um caso que
      # não mudou de payload reaproveita a resposta anterior.
      - name: Restaurar cache de respostas do provedor
        uses: actions/cache@v4
        with:
          path: backend/evals/cassettes
          key: eval-cassettes-${{ github.sha }}
          restore-keys: eval-cassettes-

      - name: Runner do eval
        id: runner
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-eval-secret-key-com-minimo-32-caracteres
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Semente fixa: duas execuções no mesmo commit têm de dar o mesmo
          # relatório (NFR-5).
          GROQ_SEED: "20260802"
        run: python -m evals.runner --json > evals/runs/ultimo-relatorio.json

      - name: Bateria de invariância
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-eval-secret-key-com-minimo-32-caracteres
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_SEED: "20260802"
        run: python -m evals.invariance > evals/runs/ultima-invariancia.json

      - name: Registrar a execução no histórico
        env:
          DATABASE_URL: postgresql+asyncpg://caloria:caloria@localhost:5432/caloria_db
          GIT_COMMIT: ${{ github.sha }}
        run: |
          python -m evals.report registrar \
            --relatorio evals/runs/ultimo-relatorio.json \
            --invariancia evals/runs/ultima-invariancia.json \
            --git-commit "$GIT_COMMIT"

      # Bloqueante por desenho: sem `continue-on-error` em nenhum passo acima.
      # `verificar` falha quando há caso vazio (NFR-3) ou quando um limiar é
      # rompido.
      - name: Verificar limiares e ausência de casos vazios
        run: python -m evals.report verificar --relatorio evals/runs/ultimo-relatorio.json

      - name: Publicar relatório como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.sha }}
          path: |
            backend/evals/runs/ultimo-relatorio.json
            backend/evals/runs/ultima-invariancia.json
            backend/evals/runs/history.jsonl
          retention-days: 90
