[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caloria-backend"
version = "0.7.0"
description = "Backend da CalorIA — diário alimentar inteligente"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Banco de dados
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Validação
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Autenticação
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Filas e cache
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    # HTTP client
    "httpx>=0.27.0",
    # IA — Groq (texto e visão)
    "groq>=0.13.0",
    # Web Push
    "pywebpush>=2.0.0",
    # E-mail transacional (SMTP)
    "aiosmtplib>=3.0.0",
    # Imagens
    "pillow>=11.0.0",
    # Busca fuzzy para lookup TACO
    "rapidfuzz>=3.0.0",
    # Rate limiting dos endpoints públicos e de IA
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-passlib>=1.7.7",
    # Driver SÍNCRONO, usado só por `scripts/seed_dev_user.py`. O runtime da
    # aplicação é 100% asyncpg; sem esta linha o script — que `make seed-user` e
    # `docs/setup.md` mandam rodar — falhava com ModuleNotFoundError.
    "psycopg2-binary>=2.9.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# Ruff — linting e formatação
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["alembic/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = [
    "E501",   # line too long (formatação fica com o ruff format)
    "B008",   # function call in argument defaults — padrão FastAPI (Depends, Query, Body)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["UP035", "UP007", "I001"]  # arquivos gerados pelo alembic

# =============================================================================
# Mypy — type checking
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Scripts utilitários não fazem parte do código de produção
module = ["scripts.*"]
ignore_errors = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
# PISO, não meta.
#
# Histórico das medições, para que subir o piso seja sempre decisão com número:
#   2026-05-10  62%  auditoria
#   2026-08-02  72%  fase B.4 (testes de push/reminders), piso posto em 70%
#   2026-08-02  73%  após o schema de teste vir das migrations, que destravou
#                    os 5 testes do golden set (medido: 73,10%)
#
# A margem entre medido e piso existia para absorver os testes que pulavam sem
# o banco nutricional semeado. Esses testes **não pulam mais** (o seed entrou em
# `tests/integration/conftest.py`), então a variação entre ambientes caiu e o
# piso pôde subir e encostar no medido.
fail_under = 72
show_missing = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
